[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
prost = "0.14.4"
search-core = { path = "crates/search-core" }
search-ingest = { path = "crates/search-ingest" }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
lto = true
strip = "debuginfo" # `true` breaks wasm-bindgen: https://github.com/cloudflare/workers-rs/issues/1014
codegen-units = 1
